[Input]
; Optional automatic activation by UI framework: focused editable Scaleform and Meridian fields.
; No Scaleform menu-name whitelist. Top input owner, visibility and text permission are checked.
; Independent ImGui interfaces (including Modex) remain manual; Prisma uses its native input.
AutoEnable=0
; F8 toggles direct IME for non-Prisma fields (in-game ImGui HUD).
; Input follows the current keyboard/IME English or native state; Ctrl+Space is optional.
; Requires SKSE Menu Framework HUD API and fonts for the languages you use.
; EnableChinese/EnableJapanese/EnableKorean and corresponding font glyphs are needed.
; Emoji display is unsupported. UI language does not select a Windows input method.
; Close mode before switching Modex fields or returning to gameplay.
HotkeyScanCode=66

[Interface]
; 0=Windows display language, 1=English, 2=Simplified Chinese, 3=Japanese, 4=Korean.
; Existing personal user.ini takes precedence; Language is also selectable in-game.
Language=0
