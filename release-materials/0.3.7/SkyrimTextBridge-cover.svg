<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<title>Skyrim Text Bridge</title>
<desc>Original vector cover in charcoal, ivory and gold. A keyboard feeds Chinese text into a field. Promotional illustration, not a game screenshot.</desc>
