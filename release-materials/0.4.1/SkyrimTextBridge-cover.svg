  <text x="154" y="899" fill="#f4f1e8" font-size="244" font-weight="700" letter-spacing="-6">BRIDGE</text>
  <text x="170" y="1020" fill="#aeb9b9" font-size="42">Chinese · Japanese · Korean IME</text>
  <text x="170" y="1100" fill="#aeb9b9" font-size="40" font-family="Microsoft YaHei, sans-serif" letter-spacing="5">中文 · 日语 · 韩语输入法支持</text>
</g>
