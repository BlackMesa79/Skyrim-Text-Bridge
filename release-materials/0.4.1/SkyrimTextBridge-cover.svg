<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
<title>Skyrim Text Bridge</title>
<desc>Original vector cover in charcoal, ivory and gold. A keyboard feeds Chinese, Japanese and Korean text into a field. Promotional illustration, not a game screenshot.</desc>
<rect width="2560" height="1440" fill="#11191b"/>
<g font-family="Segoe UI, Arial, sans-serif">
  <text x="168" y="390" fill="#b4bdbd" font-size="37" letter-spacing="13">SKYRIM SPECIAL EDITION</text>
